name: Security & Secret Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Scanner & Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Execute Security Scanner CLI
        run: |
          python -m careerorbit.security.scanner . --fail-on-findings

      - name: Run Security Test Suite
        run: |
          pytest tests/test_security_scanner_step5.py -v

      - name: Verify Sanitized Release Packaging
        run: |
          python scripts/package_release.py --verify
